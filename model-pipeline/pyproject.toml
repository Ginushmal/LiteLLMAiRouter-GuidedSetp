[project]
name = "model-pipeline"
version = "0.1.0"
description = "Multi-provider LLM model pipeline: fetch, dedupe, score, tier, and populate LiteLLM"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "rapidfuzz>=3.0",
    "pyyaml>=6.0",
]

[project.scripts]
model-pipeline = "model_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model_pipeline"]
