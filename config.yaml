# LiteLLM proxy configuration
# Docs: https://docs.litellm.ai/docs/proxy/configs

# -----------------------------------------------------------------------------
# model_list
# -----------------------------------------------------------------------------
# The tier model groups (ultra-tier / pro-tier / flash-tier / flash-lite-tier)
# are NO LONGER defined here. They are managed in LiteLLM's database by the
# `model-pipeline/` sub-project, which fetches provider models, scores them, and
# populates them via the management API (requires general_settings.store_model_in_db).
#
# Defining them here too would create duplicate deployments (config + DB entries
# are load-balanced together), so only the router lives in this file.
#
# To (re)populate the tiers:   cd model-pipeline && uv run model-pipeline populate
model_list:
  # ---------------------------------------------------------------------------
  # SMART ROUTER - complexity-based, routes to the tier model groups above.
  # The tier groups themselves come from the database (model-pipeline).
  # ---------------------------------------------------------------------------
  - model_name: smart-router
    litellm_params:
      model: auto_router/complexity_router
      complexity_router_config:
        tiers:
          SIMPLE:    flash-lite-tier
          MEDIUM:    flash-tier
          COMPLEX:   pro-tier
          REASONING: ultra-tier
        classifier_type: jev
        jev_classifier_config:
          model: jev-latest
          timeout_ms: 3000
          circuit_breaker_enabled: true
          circuit_breaker_cooldown_seconds: 30
        classifier_fallback: heuristic
      complexity_router_default_model: flash-tier

litellm_settings:
  # Drop unsupported params instead of erroring (multi-provider friendly)
  drop_params: true

  # Defaults and hard ceilings inherited by new keys/teams (UI or API)
  default_key_generate_params:
    models: ["flash-cost-optimized"]
    max_budget: 10
    budget_duration: "30d"
    duration: "90d"
    rpm_limit: 60
    tpm_limit: 100000

  upperbound_key_generate_params:
    max_budget: 100
    budget_duration: "30d"
    duration: "90d"
    max_parallel_requests: 50
    rpm_limit: 500
    tpm_limit: 500000

  default_team_params:
    max_budget: 200
    budget_duration: "30d"
    rpm_limit: 500
    tpm_limit: 500000
    models: ["flash-tier", "pro-tier"]
    team_member_permissions: ["/key/generate", "/key/info", "/key/list"]

router_settings:
  routing_strategy: cost-based-routing
  num_retries: 3
  timeout: 60
  allowed_fails: 5
  cooldown_time: 60

  # # Per-group routing strategy overrides
  # routing_groups:
  #   - group_name: pro-latency-optimized
  #     models: [pro-tier]
  #     routing_strategy: latency-based-routing
  #     routing_strategy_args:
  #       lowest_latency_buffer: 0.5
  #   - group_name: flash-cost-optimized
  #     models: [flash-tier]
  #     routing_strategy: cost-based-routing
  #   - group_name: ultra-latency-optimized
  #     models: [ultra-tier]
  #     routing_strategy: latency-based-routing
  #     routing_strategy_args:
  #       lowest_latency_buffer: 0.5
  #   - group_name: flash-lite-cost-optimized
  #     models: [flash-lite-tier]
  #     routing_strategy: cost-based-routing

general_settings:
  # Enable Admin UI model management; required for the DB-managed tier models.
  store_model_in_db: true
  # Persist request and response payloads in spend logs
  store_prompts_in_spend_logs: true

environment_variables:
