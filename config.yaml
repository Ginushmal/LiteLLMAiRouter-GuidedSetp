# LiteLLM proxy configuration
# Docs: https://docs.litellm.ai/docs/proxy/configs

# -----------------------------------------------------------------------------
# model_list
# -----------------------------------------------------------------------------
# The tier model groups (ultra-tier / pro-tier / flash-tier / flash-lite-tier)
# are NO LONGER defined here. They are managed in LiteLLM's database by the
# `model-pipeline/` sub-project, which fetches provider models, scores them, and
# populates them via the management API (requires general_settings.store_model_in_db).
#
# Defining them here too would create duplicate deployments (config + DB entries
# are load-balanced together), so only the router lives in this file.
#
# To (re)populate the tiers:   cd model-pipeline && uv run model-pipeline populate
model_list:
  # ---------------------------------------------------------------------------
  # SMART ROUTER - complexity-based, routes to the tier model groups above.
  # The tier groups themselves come from the database (model-pipeline).
  # ---------------------------------------------------------------------------
  - model_name: smart-router
    litellm_params:
      model: auto_router/complexity_router
      complexity_router_config:
        # Ascending severity. Each name is what the Jev classifier returns; each
        # description is the criteria it weighs when picking a tier.
        tier_definitions:
          - name: LITE
            description: >-
              Basic non-math, non-programming requests needing little or no reasoning:
              greetings, small talk, short factual lookups, rewriting, summarizing, and
              everyday questions with known or simple answers.
          - name: FLASH
            description: >-
              Direct instruction following and simple programming: straightforward code
              edits, short scripts, formatting, translation, data extraction, and ordinary
              tasks that are not math-heavy or deeply complex.
          - name: PRO
            description: >-
              Somewhat complex programming, mathematics, problem solving, and complex
              brainstorming or exploration: multi-step reasoning, algorithm design, and
              debugging non-trivial code.
          - name: ULTRA
            description: >-
              The highest-complexity reasoning: extremely hard problems, security
              vulnerability analysis, extreme problem solving, and very complex or
              system-level programming and architecture.
        tiers:
          LITE:  flash-lite-tier
          FLASH: flash-tier
          PRO:   pro-tier
          ULTRA: ultra-tier
        # The heuristic scorer cannot produce custom tiers, so a custom tier set uses
        # fallback_tier (its own fallback) instead of classifier_fallback: heuristic.
        fallback_tier: FLASH
        classifier_type: jev
        jev_classifier_config:
          model: jev-latest
          timeout_ms: 3000
          circuit_breaker_enabled: true
          circuit_breaker_cooldown_seconds: 30
      complexity_router_default_model: flash-tier

litellm_settings:
  # Drop unsupported params instead of erroring (multi-provider friendly)
  drop_params: true

  # Defaults and hard ceilings inherited by new keys/teams (UI or API)
  default_key_generate_params:
    models: ["smart-router"]
    max_budget: 10
    budget_duration: "30d"
    rpm_limit: 60
    tpm_limit: 1000000

  upperbound_key_generate_params:
    max_budget: 100
    budget_duration: "30d"
    duration: "90d"
    max_parallel_requests: 50
    rpm_limit: 500
    tpm_limit: 1000000

  default_team_params:
    max_budget: 200
    budget_duration: "30d"
    rpm_limit: 500
    tpm_limit: 1000000
    models: ["flash-tier", "pro-tier"]
    team_member_permissions: ["/key/generate", "/key/info", "/key/list"]

router_settings:
  routing_strategy: cost-based-routing
  num_retries: 3
  timeout: 60
  allowed_fails: 5
  cooldown_time: 60

  # Order-based fallbacks for the tiers (undocumented LiteLLM shape - verify).
  # Direct calls to a tier hop `order: 1 -> 2 -> ...` automatically when an entry
  # fails; calls arriving through the auto-router (smart-router) do not, because
  # LiteLLM builds that chain from the requested name instead of the tier it
  # picked. Each entry below repeats the hop by hand: "retry <tier>, but only its
  # order-N entries".
  # Verify after deploying: send one request to smart-router, then check that
  # LiteLLM_SpendLogs shows status=success with attempted_fallbacks >= 1. If it
  # fails with attempted_fallbacks=0, this shape is not accepted - remove it.
  fallbacks:
    - pro-tier:
        - {model: pro-tier, _target_order: 2}
        - {model: pro-tier, _target_order: 3}
        - {model: pro-tier, _target_order: 4}
        - {model: pro-tier, _target_order: 5}
    - flash-tier:
        - {model: flash-tier, _target_order: 2}
        - {model: flash-tier, _target_order: 3}
        - {model: flash-tier, _target_order: 4}
        - {model: flash-tier, _target_order: 5}
    - ultra-tier:
        - {model: ultra-tier, _target_order: 2}
        - {model: ultra-tier, _target_order: 3}
        - {model: ultra-tier, _target_order: 4}
        - {model: ultra-tier, _target_order: 5}
    - flash-lite-tier:
        - {model: flash-lite-tier, _target_order: 2}
        - {model: flash-lite-tier, _target_order: 3}
        - {model: flash-lite-tier, _target_order: 4}
        - {model: flash-lite-tier, _target_order: 5}

  # # Per-group routing strategy overrides
  # routing_groups:
  #   - group_name: pro-latency-optimized
  #     models: [pro-tier]
  #     routing_strategy: latency-based-routing
  #     routing_strategy_args:
  #       lowest_latency_buffer: 0.5
  #   - group_name: flash-cost-optimized
  #     models: [flash-tier]
  #     routing_strategy: cost-based-routing
  #   - group_name: ultra-latency-optimized
  #     models: [ultra-tier]
  #     routing_strategy: latency-based-routing
  #     routing_strategy_args:
  #       lowest_latency_buffer: 0.5
  #   - group_name: flash-lite-cost-optimized
  #     models: [flash-lite-tier]
  #     routing_strategy: cost-based-routing

general_settings:
  # Enable Admin UI model management; required for the DB-managed tier models.
  store_model_in_db: true
  # Persist request and response payloads in spend logs
  store_prompts_in_spend_logs: true
  # Forward client `x-*` headers to the upstream provider.
  # Why: OpenRouter uses the `x-session-id` header as its sticky-routing key
  # (the same value the body field `session_id` carries). It keeps a
  # conversation on one upstream provider so the provider's prompt cache stays
  # warm, and it groups the turns in OpenRouter's Logs -> Sessions view.
  # Without this, the header is dropped at the proxy and only the body field
  # works. The body field already works, so this header path is a convenience
  # for clients that can only set headers.
  # Safety: LiteLLM cleans the client headers before forwarding
  # (clean_headers in litellm/proxy/litellm_pre_call_utils.py). Credential
  # headers are NOT forwarded: `authorization`, `x-api-key` and
  # `x-litellm-api-key` are stripped unless the separate
  # `forward_llm_provider_auth_headers` setting is enabled (it is not).
  forward_client_headers_to_llm_api: true

environment_variables:
